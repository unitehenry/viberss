on:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm --prefix app install

      - name: Run lint
        run: ./scripts/lint

      - name: Check formatting
        run: ./scripts/format check

      - name: Run typecheck
        run: ./scripts/typecheck

  test:
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm --prefix app install

      - name: Install xq
        run: curl -sSL https://bit.ly/install-xq | sudo bash

      - name: Generate feeds
        run: ./scripts/feeds
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}

      - name: Build
        run: ./scripts/build

      - name: Preview
        run: ./scripts/preview &

      - name: Test feeds
        run: ./test/feeds

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm --prefix app install

      - name: Install xq
        run: curl -sSL https://bit.ly/install-xq | sudo bash

      - name: Generate feeds
        run: ./scripts/feeds
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}

      - name: Build
        run: ./scripts/build
        env:
          VITE_BASE_PATH: /viberss

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
